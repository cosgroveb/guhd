name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(scripts/release-version "$GITHUB_REF_NAME")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit="$(git rev-parse HEAD)"
          passed="$(gh run list --workflow ci.yml --commit "$commit" --event push \
            --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          if [ "$passed" != true ]; then
            echo "No successful push CI run for tagged commit $commit" >&2
            exit 1
          fi

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{deb,darwin}-*"
          path: dist
          merge-multiple: true
      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
          gh release download "$GITHUB_REF_NAME" --dir published
          scripts/verify-release dist published

  homebrew:
    needs: [version, publish]
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
